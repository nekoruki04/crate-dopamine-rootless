name: Crate
options:
  bundleIdPrefix: com.amendez
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.18.0

targets:
  Crate:
    type: application
    platform: iOS
    sources:
      - path: Sources/Crate
      - path: Resources
        excludes:
          - Info.plist
          - Crate.entitlements
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: crate
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleExternalDisplayNonInteractive:
              - UISceneConfigurationName: External Display
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).ExternalDisplaySceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSPhotoLibraryAddUsageDescription: crate saves screenshots of your VMs to Photos.
        UIBackgroundModes:
          - audio
    dependencies:
      - framework: Frameworks/Crate.xcframework
        embed: false
      - framework: Frameworks/Slirp.xcframework
        embed: true
      - framework: Frameworks/GLib.xcframework
        embed: true
      - package: SwiftTerm
    postBuildScripts:
      - name: Embed GPU frameworks
        basedOnDependencyAnalysis: false
        script: |
          [ "$PLATFORM_NAME" = iphoneos ] || exit 0
          SRC="$PROJECT_DIR/Frameworks/GPU"
          NAMES="MoltenVK EGL GLESv2 epoxy virglrenderer.1"
          DEST="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
          mkdir -p "$DEST"
          for name in $NAMES; do
            if [ -d "$SRC/$name.framework" ]; then
              rsync -a --delete "$SRC/$name.framework" "$DEST/"
            fi
          done
    entitlements:
      path: Resources/Crate.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.developer.kernel.extended-virtual-addressing: true
        get-task-allow: true
        com.apple.security.get-task-allow: true
        dynamic-codesigning: true
        com.apple.private.cs.debugger: true
        platform-application: true
        run-unsigned-code: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amendez.crate
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Crate/JIT/Crate-Bridging-Header.h
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        AD_HOC_CODE_SIGNING_ALLOWED: YES
